<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内网销售记录系统</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand" onclick="location.hash='#'">
      <span class="brand-name">讯强数码销售记录系统</span>
    </div>
    <button class="nav-toggle" id="navToggle" onclick="toggleNav(event)" aria-label="菜单">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <nav class="nav" id="nav" onclick="this.classList.remove('open')">
      <a href="#/" data-route="/">今日看板</a>
      <a href="#/new" data-route="/new">记一笔</a>
      <a href="#/records" data-route="/records">记录列表</a>
      <a href="#/stats" data-route="/stats">统计报表</a>
      <a href="#/admin" data-route="/admin" class="admin-only">基础数据</a>
    </nav>
    <div class="userbox" id="userbox"></div>
  </header>
  <main class="container" id="view"></main>
</div>

<!-- 登录遮罩 -->
<div class="login-mask" id="loginMask">
  <div class="login-shell">
    <div class="login-art">
      <img class="login-art-img" src="/login-art.png" alt="销售记录系统">
      <div class="login-art-text">
        <div class="art-title">讯强数码</div>
        <div class="art-sub">销售记录系统</div>
        <div class="art-tag">高效记录 · 数据清晰 · 团队协作</div>
      </div>
    </div>
    <div class="login-panel">
      <div class="login-title">销售记录系统</div>
      <div class="login-field">
        <label>账号</label>
        <div class="login-input select">
          <svg class="li-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <select id="loginUser"></select>
        </div>
      </div>
      <div class="login-field">
        <label>密码</label>
        <div class="login-input">
          <svg class="li-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="loginPwdInput" placeholder="请输入密码" autocomplete="current-password">
        </div>
      </div>
      <div class="login-err" id="loginErr"></div>
      <button class="login-btn" id="loginBtn" onclick="doLogin()">登 录</button>
      <div class="login-forgot" onclick="forgotPwd()">忘记密码?</div>
    </div>
  </div>
</div>

<!-- 通用弹窗 -->
<div class="modal-mask" id="modalMask" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
